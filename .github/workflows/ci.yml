# SPDX-License-Identifier: Apache-2.0
# Tier 1: runs on every pull request and every push to main, in under ten
# minutes. See CONTRIBUTING.md for what each tier covers.
#
# Every action is pinned to a full commit SHA (the tag it was taken from is in
# the trailing comment). The workflow token is read-only and no job here gets a
# secret, so a pull request from a fork runs exactly what a same-repo one does.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash: pipefail on every platform.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: plugin (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    # The referee mutants rebuild the crate once each: ten of them run past
    # 30 minutes on macos-15 (#159's run 41170845628 was cut off at the tenth).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/evidence-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The interop tests start the compiled plugin against a stand-in host over
      # mesh-llm's real plugin wire protocol; they share ports and data
      # directories, so they run one at a time. This includes the conformance
      # vectors (tests/aac_canonical_vectors.rs, the split-stage cases).
      - name: Tests
        run: cargo test --locked -- --test-threads=1

      # The plugin's mutants (gates/mutants.json): each build with one
      # deliberate fault must fail the tests the table names for it, and print
      # what it says. Among them: a receiver built without its claim checks
      # and a responder built without its sharing-policy gate must each FAIL
      # their parity runner (vectors/parity/), and a build that serves a
      # blocked model or a malformed body must fail the stand-in host tests.
      - name: The tests catch each plugin mutant
        run: bash ../../scripts/mutants.sh

      # The referee's mutants (vectors/parity/referee/mutants.json): each build
      # with one deliberate fault must fail the referee parity run on every
      # case listed for it.
      - name: Referee parity catches each implementation mutant
        shell: bash
        run: bash ../../scripts/referee-mutants.sh

      # serde_json's `unbounded_depth` is for the parity runner's fixture
      # reader only (a dev-dependency). It must never reach the plugin binary,
      # where a pushed body is parsed under the default nesting limit.
      - name: The plugin binary parses with serde_json's default nesting limit
        shell: bash
        run: |
          if cargo tree --locked -e normal,features -i serde_json | grep -q unbounded_depth; then
            echo "::error::serde_json/unbounded_depth is enabled outside the tests"
            exit 1
          fi

  web-ui:
    name: web UI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web-ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the bundle (one ES module under ../bundle)
        run: |
          pnpm build
          test "$(ls ../bundle)" = "register-mesh-plugin-ui.js"

  # Repository checks that need no toolchain beyond the runner's own.
  checks:
    name: no keys, vectors, neutrality scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: No private keys, tokens or excluded files in the tree
        run: scripts/no-keys.sh

      - name: Pinned vectors match their checksums
        working-directory: vectors
        run: sha256sum -c --quiet SHA256SUMS

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Neutrality scanner self-test (the scan itself is neutrality.yml)
        run: node scripts/neutrality-scan.mjs --self-test

      # The test files are named: a bare directory argument is read as a
      # module path by some Node versions (24 fails with "Cannot find module"),
      # and as a directory to search by others.
      - name: Neutrality scanner tests (never follows a symlink out of the tree)
        run: node --test scripts/*.test.mjs

  # The release packaging, end to end on a debug build, twice: the two archives
  # must be byte-identical.
  package:
    name: package (reproducible)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-package-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web-ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Build
        run: |
          cargo build --locked --manifest-path crates/evidence-plugin/Cargo.toml --bin capsules
          (cd web-ui && pnpm install --frozen-lockfile && pnpm build)

      - name: Package twice and compare
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' plugin.toml)
          bin=crates/evidence-plugin/target/debug/capsules
          scripts/package.sh "$version" x86_64-unknown-linux-gnu "$bin" out-a
          scripts/package.sh "$version" x86_64-unknown-linux-gnu "$bin" out-b
          cmp out-a/*.tar.gz out-b/*.tar.gz
          tar -tzf out-a/*.tar.gz | sort
