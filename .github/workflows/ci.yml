# SPDX-License-Identifier: Apache-2.0
# Tier 1: runs on every pull request and every push to main, in under ten
# minutes. See CONTRIBUTING.md for what each tier covers.
#
# Each job runs a step of scripts/check.sh, the pre-push check, so a local
# `scripts/check.sh` runs what these jobs run.
#
# Every action is pinned to a full commit SHA (the tag it was taken from is in
# the trailing comment). The workflow token is read-only and no job here gets a
# secret, so a pull request from a fork runs exactly what a same-repo one does.
#
# The Rust caches are restored on every run and saved only from a push to
# main, so a pull request never evicts main's entries; a pull request whose
# Cargo.lock changed starts from main's newest entry for the same job
# (restore-keys) instead of cold.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash: pipefail on every platform.
defaults:
  run:
    shell: bash

# A newer push to a pull request cancels its older run. Every other run (a
# push to main, a manual run) has a group of its own, so each commit on main
# gets a finished run: a shared group would keep only the newest pending one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always

jobs:
  # fmt, clippy and the tests on each platform a node runs on.
  rust:
    name: plugin (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-rust-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-rust-

      - name: fmt, clippy, tests, serde_json nesting limit
        run: scripts/check.sh rust

      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The mutants: each build with one deliberate fault must fail the tests its
  # table names (gates/mutants.json, vectors/parity/referee/mutants.json).
  # A mutant checks that the tests catch a fault in platform-independent
  # logic, so it runs once, on Linux, spread over parallel shards; the shards
  # of one size hold every row exactly once (scripts/mutant-shards.test.sh,
  # in the checks job). The shard count is the matrix's size.
  mutants:
    name: mutants (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The plain test build's cache: each mutant rebuilds only the crate.
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-rust-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-rust-

      - name: This shard's mutants
        run: scripts/check.sh mutants "${{ matrix.shard }}/${{ strategy.job-total }}"

  # A Windows node keeps its chain on the same shelf, on the plugin's own
  # lock (LockFileEx there), and moves an earlier release's flat ledger onto
  # it like any other (evidencebook#254 §2.4, §7.3). This runs the import
  # tests (a fixture import, an import killed and resumed, a mismatch that
  # refuses to start) and the data directory's lock tests on Windows,
  # and the ask book's, whose reply keeping syncs a directory only on unix.
  rust-windows:
    name: plugin (windows-x86_64, chain store and lock)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/evidence-plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-windows-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-windows-

      - name: Chain store, import and lock tests
        run: 'cargo test --locked --bin capsules -- chain_store:: data_dir:: ask_book::'

      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  web-ui:
    name: web UI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web-ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install, typecheck, unit tests, bundle build
        run: scripts/check.sh web-ui

  # Repository checks that need no toolchain beyond the runner's own.
  checks:
    name: no keys, vectors, scanner and script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # No private keys, tokens or excluded files in the tree; the pinned
      # vectors match their checksums; the neutrality scanner's self-test
      # and tests (the scan itself is neutrality.yml); the mutant shards.
      - name: Repository checks
        run: scripts/check.sh repo

  # The release packaging, end to end on a debug build, twice per archive
  # format: the two archives must be byte-identical.
  package:
    name: package (reproducible)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-package-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-package-

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web-ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # Also: plugin.toml declares min_host_version, and
      # settlement-report.sh --with-receipts hands report.sh the receipts.
      - name: Build, package twice per format and compare
        run: scripts/check.sh package

      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
