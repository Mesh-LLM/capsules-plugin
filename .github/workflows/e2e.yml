# SPDX-License-Identifier: Apache-2.0
# Tier 2: real mesh-llm nodes on one runner (two, then a third that
# corroborates one of their exchanges), each running this plugin,
# nightly, on pull requests labelled `run-e2e` and on pull requests that
# change what a node serves or what the History page reads (the `scope` job
# below). See CONTRIBUTING.md.
#
# The run itself is scripts/e2e.sh, which scripts/check.sh also runs locally.
# The mesh-llm release and the model are pinned by SHA-256 in
# scripts/e2e-inputs.env and checked after every download and every cache
# restore, so a cache entry can never stand in for a different file.
#
# Every action is pinned to a full commit SHA (the tag it was taken from is in
# the trailing comment). The workflow token is read-only and no job here gets a
# secret. The `pull_request` trigger (never `pull_request_target`) runs a fork's
# code with no secrets and a read-only token, like tier 1.
name: e2e

on:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    # `opened` is listed because a pull request whose diff selects the run must
    # get it when it is opened, not only after a later push or label.
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to a pull request cancels its older run; every other run has a
# group of its own (see ci.yml).
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_TERM_COLOR: always

jobs:
  # Whether the two-node run is needed: always except on a pull request, where
  # it is needed when the pull request carries the label `run-e2e`, or changes
  # what a node serves or what the History page reads (the plugin's source,
  # tests and dependencies, the web UI and its dependencies, the policy files
  # and the join texts the binary embeds, the run's script, the definition
  # documents, this workflow): scripts/e2e-scope.sh. Paths are read from git
  # with the base branch passed as data, never into the script text.
  scope:
    name: scope of the two-node run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          run=false
          if [ "$EVENT" != pull_request ] || [ "$LABELED" = true ]; then
            run=true
          else
            run=$(scripts/e2e-scope.sh "origin/$BASE")
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "two-node run: $run"

  two-node:
    name: two nodes, stock mesh-llm
    needs: scope
    # Nightly, by hand, or on a pull request the scope job selects.
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-12 (the action publishes no release tags)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-e2e-${{ hashFiles('crates/evidence-plugin/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.RUST_TOOLCHAIN }}-e2e-

      # The pinned inputs (scripts/e2e-inputs.env), each cached under its own
      # digest: a new mesh-llm pin keeps the model's entry, and the reverse.
      - id: pins
        run: |
          . scripts/e2e-inputs.env
          {
            echo "mesh-file=$MESH_LLM_ASSET_LINUX_X86_64"
            echo "mesh-sha=$MESH_LLM_SHA256_LINUX_X86_64"
            echo "model-file=$MODEL_FILE"
            echo "model-sha=$MODEL_SHA256"
          } >> "$GITHUB_OUTPUT"

      - id: mesh-cache
        name: Restore the pinned mesh-llm release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/e2e-inputs/${{ steps.pins.outputs.mesh-file }}
          key: e2e-mesh-llm-${{ steps.pins.outputs.mesh-sha }}

      - id: model-cache
        name: Restore the pinned model
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/e2e-inputs/${{ steps.pins.outputs.model-file }}
          key: e2e-model-${{ steps.pins.outputs.model-sha }}

      # The script opens the History pages the nodes served with web-ui's
      # own test runner, so web-ui's dependencies are installed first.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web-ui/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui's dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # Downloads what the cache lacks and checks both digests; builds the
      # plugin; two nodes, three exchanges, a third node corroborates, then
      # the scenario checks; attacks B and D against a receiver built without
      # its claim checks; the real-host tests and the blocked-model mutant
      # through the real host.
      - name: The two-node run (scripts/e2e.sh)
        run: scripts/e2e.sh ~/e2e-inputs "$RUNNER_TEMP/e2e"

      # Saved only from a run that is not a pull request's (nightly, by hand),
      # so a pull request never evicts the default branch's entries; even
      # from a failed run, since scripts/e2e.sh names a download only once
      # its digest matches (a file it never fetched is skipped with a warning).
      - if: always() && github.event_name != 'pull_request' && steps.mesh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/e2e-inputs/${{ steps.pins.outputs.mesh-file }}
          key: ${{ steps.mesh-cache.outputs.cache-primary-key }}

      - if: always() && github.event_name != 'pull_request' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/e2e-inputs/${{ steps.pins.outputs.model-file }}
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - if: github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/evidence-plugin/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # The node logs only: never the data directories, which hold each
      # node's signing key.
      - name: Keep the node logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-node-logs
          path: ${{ runner.temp }}/e2e/logs/
          if-no-files-found: ignore
          retention-days: 7
